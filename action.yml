name: 'Scan and Upload'
description: 'Performs scan with SARIF upload to GitHub Security'
author: 'Midnight'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github_token:
    description: "GitHub token for API calls (optional)"
    required: false
    default: ""
  scorecard_checks:
    description: "Comma-separated list of Scorecard checks to run. If empty, all checks run. See https://github.com/ossf/scorecard#checks for available checks."
    required: false
    default: ""
  fail_severity:
    description: "Fail the action when scans report this severity or higher (e.g. critical, high, medium). This must be set on private repos."
    required: false
    default: "critical"
  differential_gate:
    description: >-
      Set to 'true' to re-scan the PR's target branch when the severity gate
      fails, and pass only if this PR strictly reduces the finding count. Lets
      two PRs that each fix one outstanding vulnerability land independently.
      Unrelated PRs stay blocked while findings are outstanding. pull_request
      events only; pushes always use the absolute gate.
    required: false
    default: "false"
  skip_opengrep_scan:
    description: "Set to 'true' to skip the OpenGrep SAST scan"
    required: false
    default: "false"
  skip_scorecard_scan:
    description: "Set to 'true' to skip the Scorecard supply-chain scan"
    required: false
    default: "false"
  skip_checkov_scan:
    description: "Set to 'true' to skip the Checkov IaC misconfiguration scan"
    required: false
    default: "false"
  skip_zizmor_scan:
    description: "Set to 'true' to skip the zizmor GitHub Actions scan"
    required: false
    default: "false"
  skip_trivy_scan:
    description: "Set to 'true' to skip the Trivy vulnerability scan"
    required: false
    default: "false"
  skip_gitleaks_scan:
    description: "Set to 'true' to skip the gitleaks secret scan"
    required: false
    default: "false"

runs:
  using: 'composite'
  # recommended permissions to use:
  #
  # permissions:
  #   actions: read
  #   contents: read
  #   security-events: write
  #   statuses: write
  steps:
    - name: Install EarthBuild
      shell: bash
      run: |
        # renovate: datasource=github-releases packageName=EarthBuild/earthbuild
        earthbuild_version="v0.8.17"
        curl -fsSL -o /tmp/earth "https://github.com/EarthBuild/earthbuild/releases/download/${earthbuild_version}/earth-linux-amd64"
        echo "85b7f31020be220493c1ef89fe4e976985a72e54dd12b7dfcf17544c8d4fd880  /tmp/earth" | sha256sum -c --strict
        chmod 0755 /tmp/earth

    - name: Run scanners (parallel)
      continue-on-error: true
      shell: bash
      env:
        SCORECARD_CHECKS: ${{ inputs.scorecard_checks }}
        SKIP_OPENGREP_SCAN: ${{ inputs.skip_opengrep_scan }}
        SKIP_SCORECARD_SCAN: ${{ inputs.skip_scorecard_scan }}
        SKIP_CHECKOV_SCAN: ${{ inputs.skip_checkov_scan }}
        SKIP_ZIZMOR_SCAN: ${{ inputs.skip_zizmor_scan }}
        SKIP_TRIVY_SCAN: ${{ inputs.skip_trivy_scan }}
        SKIP_GITLEAKS_SCAN: ${{ inputs.skip_gitleaks_scan }}
      run: |
        # Written once and re-read by the differential gate's base scan, so the
        # two passes cannot be given different scanners. Adding a scanner means
        # editing this list only.
        {
          printf -- '--SCORECARD_CHECKS=%s\n'    "$SCORECARD_CHECKS"
          printf -- '--SKIP_OPENGREP_SCAN=%s\n'  "$SKIP_OPENGREP_SCAN"
          printf -- '--SKIP_SCORECARD_SCAN=%s\n' "$SKIP_SCORECARD_SCAN"
          printf -- '--SKIP_CHECKOV_SCAN=%s\n'   "$SKIP_CHECKOV_SCAN"
          printf -- '--SKIP_ZIZMOR_SCAN=%s\n'    "$SKIP_ZIZMOR_SCAN"
          printf -- '--SKIP_TRIVY_SCAN=%s\n'     "$SKIP_TRIVY_SCAN"
          printf -- '--SKIP_GITLEAKS_SCAN=%s\n'  "$SKIP_GITLEAKS_SCAN"
        } > "${RUNNER_TEMP:-/tmp}/scan-flags"
        mapfile -t flags < "${RUNNER_TEMP:-/tmp}/scan-flags"

        /tmp/earth "${{ github.action_path }}+scan" \
          --USER_SOURCE_DIR="$GITHUB_WORKSPACE" "${flags[@]}"
      working-directory: ${{ github.workspace }}

    - name: Collect SARIF files
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # EarthBuild's SAVE ARTIFACT AS LOCAL saves relative to the Earthfile's
        # directory, so SARIF files land in the action's directory. Copy them
        # into the workspace so subsequent steps (upload, fail-on-severity) find
        # them. When the action is used from its own repo, action_path equals
        # the workspace and this is a no-op.
        mkdir -p scan_reports
        src="$(realpath "$ACTION_PATH/scan_reports" 2>/dev/null || true)"
        dst="$(realpath scan_reports)"
        if [ -n "$src" ] && [ -d "$src" ] && [ "$src" != "$dst" ]; then
          cp -r "$src/." scan_reports/
        fi

    - name: Verify scan output
      shell: bash
      run: |
        count=$(find scan_reports -name '*.sarif' 2>/dev/null | wc -l)
        if [ "$count" -eq 0 ]; then
          echo "::error::No SARIF files produced — all scanners may have failed"
          exit 1
        fi
        echo "Found $count SARIF file(s)"

    - name: Upload SARIF files
      uses: github/codeql-action/upload-sarif@3d8036cf7fe7433e4a725cf513a6ea56c7fd0f14  #v2.25.0
      if: (success() || failure()) && github.event.repository.private == false
      continue-on-error: true
      with:
        sarif_file: scan_reports

    # Upload SARIF artifacts for private repositories
    - name: Upload SARIF artifacts
      if: (success() || failure()) && github.event.repository.private == true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: sarif_reports
        path: scan_reports

    # Three steps so the expensive part - re-scanning the target branch - runs
    # only when the cheap absolute gate has already failed. Green PRs pay nothing.
    - name: Fail on severity
      id: severity_gate
      shell: bash
      if: inputs.fail_severity != ''
      env:
        INPUT_SEVERITY: ${{ inputs.fail_severity }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        count_file="${RUNNER_TEMP:-/tmp}/head-findings-count"
        set +e
        FINDINGS_COUNT_FILE="$count_file" \
          "$ACTION_PATH/scripts/fail-on-severity.sh" "$INPUT_SEVERITY" scan_reports
        rc=$?
        set -e
        case "$rc" in
          0) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
          1) echo "verdict=blocked" >> "$GITHUB_OUTPUT"
             echo "head_count=$(cat "$count_file")" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::severity gate could not run (exit $rc) - see above"
             exit 1 ;;
        esac

    - name: Scan target branch for comparison
      id: base_scan
      if: >-
        steps.severity_gate.outputs.verdict == 'blocked'
        && inputs.differential_gate == 'true'
        && github.event_name == 'pull_request'
      shell: bash
      env:
        INPUT_SEVERITY: ${{ inputs.fail_severity }}
        ACTION_PATH: ${{ github.action_path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        base_dir="${RUNNER_TEMP:-/tmp}/base-src"
        "$ACTION_PATH/scripts/materialise-base.sh" \
          "$BASE_SHA" "$base_dir" "$GITHUB_WORKSPACE"

        # Same binaries, same vuln DB fetch, same job: the counts are comparable
        # because they are produced minutes apart. A base scan cached from an
        # earlier day drifts as Trivy's database updates, inventing findings.
        flags_file="${RUNNER_TEMP:-/tmp}/scan-flags"
        if [ ! -f "$flags_file" ]; then
          echo "::error::$flags_file is missing - the head scan step did not run"
          exit 1
        fi
        mapfile -t flags < "$flags_file"

        # --no-cache is required, not a precaution. +user-source stages the tree
        # with LOCALLY, so its contents do not enter the cache key of the
        # scanner targets that COPY from it. Without this, the base scan in the
        # same job is served the head scan's SARIF: the counts come out equal,
        # the gate blocks every PR, and it looks exactly like correct policy.
        # Verified by scanning two different trees in sequence - the second
        # returned the first's findings, including its file paths.
        /tmp/earth --no-cache "${ACTION_PATH}+scan" \
          --USER_SOURCE_DIR="$base_dir" "${flags[@]}" || true

        # Own directory: head SARIFs are already uploaded by now, and mixing the
        # two would misattribute target-branch findings to the PR.
        rm -rf scan_reports_base
        mkdir -p scan_reports_base
        src="$(realpath "$ACTION_PATH/scan_reports" 2>/dev/null || true)"
        if [ -n "$src" ] && [ -d "$src" ]; then
          cp -r "$src/." scan_reports_base/
        fi

        count_file="${RUNNER_TEMP:-/tmp}/base-findings-count"
        set +e
        FINDINGS_COUNT_FILE="$count_file" \
          "$ACTION_PATH/scripts/fail-on-severity.sh" "$INPUT_SEVERITY" scan_reports_base
        rc=$?
        set -e
        if [ "$rc" -gt 1 ]; then
          echo "::error::could not count findings on the target branch (exit $rc)"
          exit 1
        fi
        echo "base_count=$(cat "$count_file")" >> "$GITHUB_OUTPUT"

    - name: Severity verdict
      if: steps.severity_gate.outputs.verdict == 'blocked'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DIFFERENTIAL: ${{ inputs.differential_gate }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_COUNT: ${{ steps.severity_gate.outputs.head_count }}
        BASE_COUNT: ${{ steps.base_scan.outputs.base_count }}
      run: |
        if [ "$DIFFERENTIAL" != "true" ]; then
          echo "::error::findings at or above the severity threshold (see above)"
          exit 1
        fi
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "::error::findings at or above the severity threshold (see above)"
          echo "differential_gate is enabled but only applies to pull_request events;" \
               "this is a '$EVENT_NAME' event, so the absolute gate applies."
          exit 1
        fi
        "$ACTION_PATH/scripts/differential-gate.sh" "$HEAD_COUNT" "$BASE_COUNT"

    # Last, and always(): the step above is built to fail, and a failing step
    # ends a composite action, so anywhere earlier and the summary would appear
    # only on green runs - backwards, since the red one is the one worth
    # reading. Being last is also what lets it report the differential outcome:
    # severity_gate says 'blocked', but with differential_gate a blocked head
    # still passes on 2 -> 1, and only this point knows which happened.
    #
    # Costs no permissions - it writes a file, it does not call an API - so it
    # reaches fork pull requests, where security-events: write is not granted
    # and the Security-tab upload silently fails, and private repositories
    # without GHAS, which get a zip of raw SARIF and nothing else.
    - name: Job summary
      if: always()
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_SEVERITY: ${{ inputs.fail_severity }}
        DIFFERENTIAL: ${{ inputs.differential_gate }}
        EVENT_NAME: ${{ github.event_name }}
        GATE_VERDICT: ${{ steps.severity_gate.outputs.verdict }}
        HEAD_COUNT: ${{ steps.severity_gate.outputs.head_count }}
        BASE_COUNT: ${{ steps.base_scan.outputs.base_count }}
        # Locations link to the branch's own files. On a pull_request GITHUB_SHA
        # is the ephemeral refs/pull/N/merge commit, which is not what a reader
        # following the link expects to land on.
        LINK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        # scan_reports only. On the differential path scan_reports_base also
        # exists, and summing the two would report the target branch's findings
        # as if this PR had introduced them.
        if [ ! -d scan_reports ]; then
          echo "no scan_reports directory - skipping the summary"
          exit 0
        fi

        if [ -z "$INPUT_SEVERITY" ]; then
          verdict=""
        elif [ "$GATE_VERDICT" != "blocked" ]; then
          verdict="Gate **passed** at \`$INPUT_SEVERITY\`."
        elif [ "$DIFFERENTIAL" = "true" ] && [ "$EVENT_NAME" = pull_request ] \
             && [ -n "$BASE_COUNT" ] && [ "${HEAD_COUNT:-0}" -lt "$BASE_COUNT" ]; then
          verdict="Gate **passed** on the differential rule: $BASE_COUNT finding(s) on the"
          verdict="$verdict target branch, $HEAD_COUNT with this PR applied."
        else
          verdict="Gate **failed** at \`$INPUT_SEVERITY\`."
          if [ -n "$BASE_COUNT" ]; then
            verdict="$verdict The count did not go down: $BASE_COUNT on the target"
            verdict="$verdict branch, $HEAD_COUNT with this PR applied."
          fi
        fi

        # Never fail the build over a report: the verdict is decided above, and
        # a renderer that broke must not turn a passing scan red.
        "$ACTION_PATH/scripts/step-summary.sh" \
          "$INPUT_SEVERITY" scan_reports "$verdict" || {
            echo "::warning::could not render the job summary (the gate verdict stands)"
          }
